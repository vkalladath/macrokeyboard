# Macro pad mapping — CH57x 3x1 keys + 1 knob (USB 1189:8890)
#
# Physical layout, normal orientation: buttons on the left, knob on the right.
#   [ key 1 ] [ key 2 ] [ key 3 ]   (o) knob
#
# Programming requires write access to the vendor interface (1.1, EP 0x02 OUT).
# See README.md — a udev rule grants this to the logged-in user.

model: ch57x-2
orientation: normal
rows: 1
columns: 3
knobs: 1

# This pad has no layer-switch button, so a single layer is used.
layers:
  - buttons:
      # key 1: mic mute
      #   The CH57x consumer page has no "mic mute" usage, so emit a chord
      #   that nothing else uses and bind it in GNOME (see setup-mic-mute.sh).
      - ["ctrl-alt-shift-m", "play", "mute"]
    knobs:
      # F16/F14/F15, NOT F13: on this machine the F13 keycode opens GNOME
      # Settings (it resolves to XF86Tools, which gsd binds to
      # control-center). Verified by emitting each code in isolation —
      # F13 opens Settings, F14..F21 are inert.
      #
      # NOT volume keys either: the overlay uses the knob for menu
      # navigation, and volume keys would change the system volume (and
      # flash the OSD) on every detent while scrolling a menu.
      #
      # overlay/app.py handles both jobs: menu navigation when the overlay
      # is open, volume steps when it is closed.
      - ccw: "f16"
        press: "f15"
        cw: "f14"
